
[versions]
kotlin = "2.3.0"
coroutines = "1.8.1"
mordant = "3.0.2"
serialization = "1.7.3"
koog = "0.6.2"
koin = "3.5.6"
ktor = "3.4.0"
sqldelight = "2.2.1"
multiplatform-settings = "1.3.0"
appdirs = "1.5.0"

# Testing
kotest = "5.9.1"
junit = "5.10.2"

# Quality tools
detekt = "1.23.7"
ktlint = "14.0.1"
kover = "0.8.3"

# Documentation & Publishing
dokka = "1.9.20"
maven-publish = "0.35.0"

# Build tools
graalvm-native = "0.9.28"
binary-compatibility = "0.14.0"

[libraries]
# Mordant ecosystem
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
mordant-coroutines = { module = "com.github.ajalt.mordant:mordant-coroutines", version.ref = "mordant" }
mordant-markdown = { module = "com.github.ajalt.mordant:mordant-markdown", version.ref = "mordant" }
mordant-jvm-jna = { module = "com.github.ajalt.mordant:mordant-jvm-jna", version.ref = "mordant" }

# Kotlin coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# Dependency Injection
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Testing
kotest = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
systemrules = "com.github.stefanbirkner:system-rules:1.19.0"

# Utilities
colormath = "com.github.ajalt.colormath:colormath:3.6.0"
markdown = "org.jetbrains:markdown:0.7.3"
jna-core = "net.java.dev.jna:jna:5.14.0"
r8 = "com.android.tools:r8:8.3.37"
slf4j-nop = "org.slf4j:slf4j-nop:2.0.17"
appdirs = { module = "net.harawata:appdirs", version.ref = "appdirs" }

# Settings (multiplatform)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-serialization = { module = "com.russhwolf:multiplatform-settings-serialization", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }
multiplatform-settings-make-observable = { module = "com.russhwolf:multiplatform-settings-make-observable", version.ref = "multiplatform-settings" }

# GraalVM
graalvm-svm = "org.graalvm.nativeimage:svm:23.1.0"

# AI/IA Framework (Koog)
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-agents-planner = { module = "ai.koog:agents-planner", version.ref = "koog" }
koog-tools = { module = "ai.koog:agents-tools", version.ref = "koog" }
koog-features-event-handler = { module = "ai.koog:agents-features-event-handler", version.ref = "koog" }
koog-features-memory = { module = "ai.koog:agents-features-memory", version.ref = "koog" }
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }

# SQLDelight
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# Build logic plugins (for build-logic module)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }

[bundles]
mordant = ["mordant", "mordant-coroutines", "mordant-markdown", "mordant-jvm-jna"]
testing = ["kotest", "coroutines-test"]
koog = ["koog-agents", "koog-tools", "koog-features-event-handler","koog-agents-planner","koog-features-memory"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
graalvm-nativeimage = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
binary-compatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
