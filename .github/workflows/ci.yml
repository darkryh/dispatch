name: CI

# Validation gate for the library. Two REQUIRED jobs run in parallel: the fast static/unit gate, and
# the slower PTY end-to-end suite (decoupled from `check` so it runs only here, not on every build).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs of the same ref to save Actions minutes (matters on a private repo).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege; CI never needs write or secrets (it can run on fork PRs)

jobs:
  build-test-quality:
    name: Build · test · quality · API
    runs-on: ubuntu-latest # PTY tests are terminal-geometry sensitive, not OS sensitive — never pay macOS 10x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `check` already runs unit/render tests + detekt(detektMain/detektTest, type resolution) + ktlint
      # + apiCheck per module. terminalE2eTest is NOT in `check` (decoupled), so this stays fast & green.
      - name: Validate
        run: ./gradlew check verifyModuleBoundaries --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 7

  pty-e2e:
    name: PTY end-to-end
    # Flicker is a presentation-timing defect, and presentation timing is precisely where terminal
    # emulators and PTY buffering differ between platforms. The previous "PTY tests are not OS
    # sensitive" assumption is why a macOS-only blink survived a green Linux CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true' # build-test-quality owns the cache write on push; don't race it
      # Drives the installed sample binary through a real pseudo-terminal. Screen navigation goes
      # through the command palette (a 1-D list), so it is robust to launcher-grid layout and to
      # slow-runner key timing.
      - name: Terminal e2e
        run: ./gradlew :dispatch-sample:terminalE2eTest --stacktrace
      # NOTE: :dispatch-sample:terminalStressTest is deliberately NOT wired in yet. It fails on
      # unmodified master too (verified by stashing all render changes and re-running): around the
      # ~100th message the runtime hibernates mid-run, stops repainting, and the next awaitText
      # times out. That is a pre-existing defect in the stress scenario, unrelated to rendering.
      # Wire it in once that is fixed — it is the only suite that produces the reliability report.
      # Replay every recording through the terminal model and judge what the screen showed.
      # This is the only gate that can see flicker; the byte-level assertions structurally cannot.
      - name: Render invariants
        run: ./gradlew :dispatch-vt:test -Ddispatch.vt.requireCorpus=true --stacktrace
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-e2e-report-${{ matrix.os }}
          path: |
            dispatch-sample/build/reports/
            dispatch-vt/build/reports/
          if-no-files-found: ignore
          retention-days: 7
