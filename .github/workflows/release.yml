name: Release

# Tag-driven CD. Pushing a `vX.Y.Z[-betaNN]` tag (or running this manually) validates, then publishes
# every library module to Maven Central stamped with the tag version, then cuts a GitHub Release.
# Pages is intentionally NOT redeployed here — the GitHub Release fires `release: published`, which the
# initializr-pages workflow listens for (one deploy, no duplication).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release WITHOUT the leading v (e.g. 1.0.0-beta02)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-flight publish

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central # protected env: require a reviewer here so a tag can't ship unattended
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for release-note generation
      - uses: ./.github/actions/setup

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ] || [ "$V" = "v" ]; then echo "::error::Empty version"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $V"

      - name: Guard against re-releasing a published version
        run: |
          V="${{ steps.ver.outputs.version }}"
          URL="https://repo1.maven.org/maven2/io/github/darkryh/dispatch/dispatch-core/$V/dispatch-core-$V.pom"
          if curl -sfI "$URL" >/dev/null 2>&1; then
            echo "::error::$V is already on Maven Central — coordinates are immutable. Bump the version."
            exit 1
          fi

      - name: Validate (full gate)
        run: ./gradlew check verifyModuleBoundaries -PVERSION_NAME=${{ steps.ver.outputs.version }} --stacktrace

      - name: Publish + auto-release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PVERSION_NAME=${{ steps.ver.outputs.version }} -PautoRelease=true --stacktrace

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job needs write, only to create the Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release (fires release:published → Pages redeploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.publish.outputs.version }}"
          PRERELEASE=""
          case "$V" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$V" --title "v$V" --generate-notes $PRERELEASE
