name: Deploy initializr to GitHub Pages

# Builds the Kotlin/Wasm + Compose Multiplatform web initializer and publishes the static browser
# distribution to GitHub Pages. Runs when the initializer changes, when a release is published (so the
# live site always tracks the latest version), and on demand.
#
# PREREQUISITE: repo Settings → Pages → Source must be "GitHub Actions" for the deploy job below to
# work. (It is currently "Deploy from a branch / gh-pages" — the manual stopgap. Flip the source and
# retire the gh-pages branch when Actions minutes are available.)
on:
  push:
    branches: [master]
    paths:
      - "initializr/**"
      - ".github/workflows/initializr-pages.yml"
  release:
    types: [published] # a new library release republishes the site
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Pin the generated projects (and the footer version) to the released Dispatch version, so the
      # live site tracks whatever tag was cut — alpha, beta, rc or stable. On a release it's the release
      # tag; otherwise the most recent release (incl. pre-releases). Empty falls back to the build default.
      - name: Resolve Dispatch version to pin
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Pinning generated projects to Dispatch version: ${V:-<build default>}"
      - name: Build Wasm browser distribution
        run: ./gradlew -p initializr wasmJsBrowserDistribution -PdispatchVersion="${{ steps.ver.outputs.version }}" --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: initializr/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
