kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
# Build performance — biggest CI minute-saver on cold runners. (configuration-cache is intentionally
# NOT enabled: the build reads gradle.startParameter.taskNames at configuration time.)
org.gradle.caching=true
org.gradle.parallel=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Mordant version to use
mordantVersion=3.0.2

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
